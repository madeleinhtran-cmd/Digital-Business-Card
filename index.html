<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101d33">
<title>Madelein Tran | Digital Business Card</title>
<meta name="description" content="Connect with Madelein Tran — business transformation, supply chain, data and AI.">
<style>
:root{--navy:#101d33;--navy2:#1c304e;--gold:#e5cfa5;--paper:#f8f6f1;--ink:#182840}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#0b1628,#213958);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:28px 16px}.card{width:min(100%,430px);background:var(--paper);border-radius:24px;overflow:hidden;box-shadow:0 24px 80px #0005}.hero{background:linear-gradient(145deg,var(--navy),var(--navy2));color:white;text-align:center;padding:44px 25px 34px;border-bottom:4px solid var(--gold)}.headshot{width:116px;height:116px;object-fit:cover;object-position:center 32%;border:3px solid var(--gold);border-radius:50%;display:block;margin:0 auto 20px;box-shadow:0 8px 28px #0004}.monogram{width:78px;height:78px;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;margin:auto auto 20px;color:var(--gold);font-family:Georgia,serif;font-size:30px;letter-spacing:1px}h1{font:normal 34px Georgia,serif;margin:0 0 10px}.role{color:var(--gold);font-size:13px;letter-spacing:.08em;text-transform:uppercase;line-height:1.6}.focus{font-size:13px;opacity:.82;line-height:1.7;margin:13px 0 0}.body{padding:28px 24px 30px}.intro{text-align:center;font-size:14px;line-height:1.7;margin:0 0 23px;color:#4a576a}.links{display:grid;gap:11px}.link{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:53px;border-radius:12px;text-decoration:none;font-weight:650;font-size:15px;border:1px solid #c7b18b;color:var(--navy);background:transparent;transition:transform .15s,background .15s}.link:hover{transform:translateY(-1px);background:#efe9dd}.link.primary{background:var(--navy);color:white;border-color:var(--navy)}.link.primary:hover{background:#233b5e}.link[aria-disabled="true"]{opacity:.65;cursor:not-allowed}.footer{text-align:center;color:#758092;font-size:11px;margin-top:24px}.footline{height:1px;background:#ded6c9;margin-bottom:17px}svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}@media(prefers-reduced-motion:reduce){.link{transition:none}}
</style>
</head>
<body><main class="card"><header class="hero"><img class="headshot" src="headshot.jpg" alt="Professional headshot of Madelein Tran" width="116" height="116"><h1>Madelein Tran</h1><div class="role">Business Process Analyst III</div><p class="focus">Supply Chain · Data &amp; AI · Business Transformation</p></header><section class="body"><p class="intro">Connecting business strategy, intelligent technology, and actionable insights.</p><nav class="links" aria-label="Contact links">
<a class="link primary" id="save" href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 13-6M19 16v6m-3-3h6"/></svg>Save Contact</a>
<a class="link" href="https://www.linkedin.com/in/madeleintran" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10v7m0-10v.2M12 17v-7m0 3a3 3 0 0 1 6 0v4"/></svg>LinkedIn</a>
<a class="link" id="email" href="#"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 7 9-7"/></svg>Email</a>
</nav><footer class="footer"><div class="footline"></div>Digital business card · No account required to view</footer></section></main>
<script>
/* Contact email for the email button and vCard. */
const CONTACT_EMAIL = 'Madeleinhtran@gmail.com';
const FULL_NAME = 'Madelein Tran';
const TITLE = 'Business Process Analyst III';
const LINKEDIN = 'https://www.linkedin.com/in/madeleintran';
function vcfEscape(s){return s.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
const email=document.getElementById('email');
if(CONTACT_EMAIL){email.href='mailto:'+CONTACT_EMAIL}else{email.href='mailto:YOUR_EMAIL@example.com?subject=Connecting%20with%20Madelein';email.title='Replace the email placeholder before publishing'}
document.getElementById('save').addEventListener('click',e=>{e.preventDefault();const fields=['BEGIN:VCARD','VERSION:3.0','N:Tran;Madelein;;;','FN:'+vcfEscape(FULL_NAME),'TITLE:'+vcfEscape(TITLE),'URL:'+LINKEDIN];if(CONTACT_EMAIL)fields.push('EMAIL;TYPE=INTERNET:'+CONTACT_EMAIL);fields.push('END:VCARD');const blob=new Blob([fields.join('\r\n')+'\r\n'],{type:'text/vcard;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Madelein-Tran.vcf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)});
</script></body></html>
